<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      :root {
        --ink: #1c2430;
        --sky: #6eb6ff;
        --foam: #f3f7fb;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, rgba(110, 182, 255, 0.35), transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(120, 200, 170, 0.28), transparent 45%),
          linear-gradient(160deg, #eef4fa 0%, var(--foam) 50%, #e7eef6 100%);
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        animation: fade-up 0.8s ease both;
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
  </body>
</html>
