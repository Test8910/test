[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multicam-post"
version = "0.1.0"
description = "CNC post processor for MultiCam JobServer and A2MC/AMC controllers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MultiCam Post Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
multicam-post = "multicam_post.cli:main"

[tool.setuptools.packages.find]
include = ["multicam_post*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
